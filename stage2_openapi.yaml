openapi: 3.0.3
info:
  title: Ecommerce Platform API (Stage 2 - Contracts)
  version: 'v2'
servers:
  - url: https://staging.api.example.com
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Product:
      type: object
      properties:
        id:
          type: string
        sku:
          type: string
        title:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        currency:
          type: string
      required: [id, sku, title, price, currency]
paths:
  /products:
    get:
      summary: List products
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
    post:
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Product'
      responses:
        '201':
          description: Created
  /products/{id}:
    get:
      summary: Get product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
security:
  - bearerAuth: []

# NOTE: This is a minimal contract skeleton. Expand with query params, filters, pagination, and error schemas before Stage 4.